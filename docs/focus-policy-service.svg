<rect x="1410.0" y="245.0" width="300" height="110" rx="12" fill="#FFEDD5" stroke="#F97316" stroke-width="2.2"/>
<text x="1560" y="270" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">PostgreSQL  policy_db</text>
<text x="1560" y="290" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">소스별 조건 · 합친 조건 · 근거 · 충돌 · 정정 이력</text>
<text x="1560" y="306" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">표 5개 + outbox · inbox</text>
<text x="1560" y="322" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">조건 20칸 — null 은 정보 없음</text>
