<text x="1560" y="590" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">extract-service</text>
<text x="1560" y="610" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">원문에서 동반 조건을 뽑아</text>
<text x="1560" y="626" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">소스마다 한 벌씩 넣음</text>
<text x="1560" y="642" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">규칙 + 모델 두 번 읽기</text>
