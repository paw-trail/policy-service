<rect x="1006" y="790" width="102" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="1010" y="802" font-size="13" font-weight="normal" text-anchor="start" fill="#9CA3AF">policy.changed</text>
<polyline points="550.0,810 180,810 180,750.0" fill="none" stroke="#9CA3AF" stroke-width="2.4" marker-end="url(#ah-9CA3AF)" stroke-dasharray="7,6"/>
<rect x="285" y="790" width="170" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="370" y="802" font-size="13" font-weight="normal" text-anchor="middle" fill="#9CA3AF">policy.changed  캐시 비우기</text>
<text x="40" y="880" font-size="13" font-weight="normal" text-anchor="start" fill="#4B5563">조건은 소스마다 한 벌씩 받아 한 벌로 합침 — OWNER &gt; MANUAL &gt; 공공 3종 · 공공끼리는 칸마다 채우고, 값이 갈리면 충돌로 남겨 배지를 붙임</text>
<text x="40" y="902" font-size="13" font-weight="normal" text-anchor="start" fill="#4B5563">null 과 false 는 다른 값임 — null 은 정보 없음, false 는 요구하지 않음 · 관리자 정정은 20칸 전체 교체라 비워 둔 칸도 뜻을 가짐</text>
<text x="40" y="924" font-size="13" font-weight="normal" text-anchor="start" fill="#4B5563">batch 가 내보내는 것(조건 · 충돌 여부 · 최상위 티어 · 근거)이 바뀔 때만 판을 올리고 policy.changed 를 냄 · 한 장소의 쓰기는 장소 잠금으로 한 줄로 섬</text>
<text x="1836" y="948" font-size="11" text-anchor="end" fill="#9CA3AF">policy-service 를 중심으로 · 직접 연결된 것만</text></svg>