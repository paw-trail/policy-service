<text x="820" y="428" font-size="22" font-weight="bold" text-anchor="middle" fill="#111827">policy-service  :8085</text>
<text x="820" y="448" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">장소마다 동반 조건을 한 벌로 합쳐 둠</text>
<text x="820" y="464" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">API 8개  (공개 1 · internal 2 · 관리자 5)</text>
